name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  workflow_dispatch:  # Allow manual triggers (from any branch, for testing)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Work out the tags.
      # Every build gets a version tag that never changes: the first 7 characters
      # of the commit (e.g. gold-server:679cf84). The shop PC can pin that version
      # with APP_VERSION in .env, so an update only happens when we choose it, and
      # older versions stay on Docker Hub for rollback.
      # ":latest" is only moved by builds of main, never by a test run from a branch.
      - name: Work out image tags
        id: tags
        run: |
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 4: Build and push client image with build argument
      - name: Build and push client image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gold-client
          VERSION: ${{ steps.tags.outputs.version }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          docker build --build-arg REACT_APP_API_URL=http://server:5000 -t "$IMAGE:$VERSION" ./client
          docker push "$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      # Step 5: Build and push server image
      - name: Build and push server image
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/gold-server
          VERSION: ${{ steps.tags.outputs.version }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          docker build -t "$IMAGE:$VERSION" ./server
          docker push "$IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Summary
        run: |
          echo "Version tag: ${{ steps.tags.outputs.version }}  (latest moved: ${{ steps.tags.outputs.latest }})" >> "$GITHUB_STEP_SUMMARY"
