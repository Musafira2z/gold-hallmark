version: '3.9'

services:
  client:
    image: programminghero/gold-client:latest
    restart: always
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://server:5000
    ports:
      - "3001:80" # Map port 80 from the container to 3000 on the host
    environment:
      REACT_APP_API_URL: http://server:5000
    depends_on:
      - server

  server:
    image: programminghero/gold-server:latest
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000" # Map port 5000 from the container to 5000 on the host
    environment:
      MONGO_URI: mongodb://mongo:27017/goldhallmark
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups

  # Database backup. Uses the same mongo:7 image (nothing new to download).
  # Backs up every 6 hours while the PC is on, keeps the newest 14 + 8 weekly.
  # Files land in ./backups (or BACKUP_HOST_DIR from .env, e.g. a Google Drive folder).
  # Restore: docker compose run --rm backup restore   (see backups/README.md)
  backup:
    image: mongo:7
    restart: always
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: goldhallmark
      TZ: Asia/Dhaka
      BACKUP_EVERY_MINUTES: "360"
      KEEP: "14"
      KEEP_WEEKLY: "8"
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    # tr strips Windows line endings in case the file was checked out with CRLF
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup.sh > /tmp/backup.sh && exec bash /tmp/backup.sh \"$$@\"", "backup"]
    command: ["loop"]

volumes:
  mongo-data:
